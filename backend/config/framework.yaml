framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
    http_method_override: true
    php_errors:
        log: true
    router:
        utf8: true

when@dev:
    framework:
        profiler: { only_exceptions: false }
